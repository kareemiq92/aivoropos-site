<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 340" width="890" height="340">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b8cff"/>
      <stop offset="0.55" stop-color="#6f5ef0"/>
      <stop offset="1" stop-color="#4a36cf"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#c9bfff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c9bfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f7dff"/>
      <stop offset="1" stop-color="#5a3fe0"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2c1a8c" flood-opacity="0.36"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2c1a8c" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile"><rect x="0" y="0" width="240" height="240" rx="58"/></clipPath>
  </defs>
  <g transform="translate(50 40)">
    <rect x="0" y="0" width="240" height="240" rx="58" fill="url(#body)" filter="url(#drop)"/>
    <g clip-path="url(#tile)">
      <rect x="0" y="120" width="240" height="120" fill="url(#glow)"/>
      <ellipse cx="120" cy="18" rx="150" ry="92" fill="url(#sheen)"/>
    </g>
    <rect x="2.5" y="2.5" width="235" height="235" rx="56" fill="none" stroke="url(#rim)" stroke-width="3"/>
    <g filter="url(#soft)" fill="none" stroke="#ffffff" stroke-linecap="round">
      <circle cx="80" cy="108" r="30" stroke-width="17"/>
      <circle cx="160" cy="108" r="30" stroke-width="17"/>
      <path d="M86 176 q34 22 68 0" stroke-width="14"/>
    </g>
  </g>
  <text x="340" y="222" font-family="'Segoe UI', Tahoma, sans-serif" font-size="170" font-weight="700" letter-spacing="-4"><tspan fill="#a99cff">Ai</tspan><tspan fill="#ffffff">voro</tspan></text>
</svg>
